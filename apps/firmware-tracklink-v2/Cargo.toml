[package]
name = "firmware-tracklink-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Production firmware binary for TrackLink V2 board"

[features]
default = ["std"]
std = ["rc-brain/std", "bsp-tracklink-v2/std", "rc-drivers-esp32s3/std"]
embedded = [
    "esp-hal/esp32s3",
    "esp-hal/unstable",
    "esp-hal/rt",
    "rc-drivers-esp32s3/embedded",
    "esp-bootloader-esp-idf/esp32s3",
    "dep:esp-rtos",
    "dep:esp-radio",
    "dep:esp-alloc",
    "dep:trouble-host",
    "dep:bt-hci",
    "dep:static_cell",
    "dep:embassy-executor",
    "dep:esp-println",
    "dep:log"
]

[dependencies]
rc-brain = { path = "../../crates/rc-brain", default-features = false }
bsp-tracklink-v2 = { path = "../../crates/boards/bsp-tracklink-v2", default-features = false }
bsp-core = { path = "../../crates/boards/bsp-core", default-features = false }
rc-core = { path = "../../crates/rc-core", default-features = false }
rc-drivers-esp32s3 = { path = "../../crates/rc-drivers-esp32s3", default-features = false }
rk-rs = { workspace = true }
log = { workspace = true, optional = true }
esp-println = { workspace = true, optional = true, features = ["esp32s3", "log", "jtag-serial"] }
esp-hal = { workspace = true, optional = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }
esp-rtos = { workspace = true, optional = true, features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { workspace = true, optional = true, features = ["esp32s3", "ble", "unstable"] }
esp-alloc = { workspace = true, optional = true, features = ["esp32s3", "compat", "global-allocator"] }
trouble-host = { workspace = true, optional = true, features = ["peripheral", "gatt", "derive", "default-packet-pool"] }
bt-hci = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
