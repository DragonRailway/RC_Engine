[package]
name = "firmware-rk-ultra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Production firmware binary for RK_ULTRA Flagship board"

[features]
default = ["std"]
std = ["rc-brain/std", "bsp-rk-ultra/std"]

[dependencies]
rc-brain = { path = "../../crates/rc-brain" }
bsp-rk-ultra = { path = "../../crates/boards/bsp-rk-ultra" }
bsp-core = { path = "../../crates/boards/bsp-core" }
rc-core = { path = "../../crates/rc-core" }
rk-rs = { path = "../../../rk-rs/crates/rk-rs" }
