[workspace]
members = [
    "crates/rc-dsp",
    "crates/rc-core",
    "crates/rc-boards",
    "crates/rc-brain",
    "crates/boards/bsp-core",
    "crates/boards/bsp-tracklink-v3",
    "crates/boards/bsp-rk-ultra",
    "crates/boards/bsp-mikro-v2",
    "crates/boards/bsp-gtrack",
    "crates/boards/bsp-tracklink-v2",
    "crates/rc-drivers-esp32s3",
    "crates/rc-storage",
    "crates/rc-sensors",
    "apps/firmware-tracklink-v3",
    "apps/firmware-tracklink-v2",
    "apps/firmware-rk-ultra",
    "apps/firmware-mikro-v2",
    "apps/firmware-gtrack",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["RC Engine Team"]
repository = "https://github.com/DragonRailway/RC_Engine"
readme = "README.md"

[workspace.dependencies]
heapless = { version = "0.8", default-features = false, features = ["serde"] }
byteorder = { version = "1.5", default-features = false }
libm = "0.2"
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-futures = "0.1"
embedded-io-async = "0.7"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.5", default-features = false }
rk-rs = { git = "https://github.com/Radio-Kit/RK-Embassy.git", default-features = false }
esp-hal = { version = "1.2.2", default-features = false }
esp-bootloader-esp-idf = { version = "0.6.0", default-features = false }
nb = "1.1"
esp-rtos = { version = "0.4.0", default-features = false }
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = ["esp-alloc"] }
esp-alloc = { version = "0.11.0", default-features = false, features = ["compat"] }
trouble-host = { version = "=0.7.0", default-features = false }
bt-hci = { version = "0.9.0", default-features = false }
static_cell = "2.1"
embassy-executor = { version = "0.10.0", default-features = false }


[patch."https://github.com/Radio-Kit/RK-Embassy.git"]
rk-rs = { path = "../rk-rs/crates/rk-rs" }
rk-core = { path = "../rk-rs/crates/rk-core" }
rk-embassy = { path = "../rk-rs/crates/rk-embassy" }
rk-transport-serial = { path = "../rk-rs/crates/rk-transport-serial" }
rk-transport-ble = { path = "../rk-rs/crates/rk-transport-ble" }
