[package]
name = "rc-drivers-esp32s3"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ESP32-S3 hardware drivers for RC Engine: Power latch, Battery ADC, Motor PWM, and I2S DMA"

[features]
default = []
std = ["bsp-core/std", "rc-dsp/std"]
embedded = [
    "esp-hal/esp32s3",
    "esp-hal/unstable",
    "dep:nb",
    "dep:esp-rtos",
    "dep:esp-radio",
    "dep:esp-alloc",
    "dep:trouble-host",
    "dep:bt-hci",
    "dep:static_cell",
    "dep:embassy-executor"
]

[dependencies]
bsp-core = { path = "../boards/bsp-core", default-features = false }
rc-dsp = { path = "../rc-dsp", default-features = false }
esp-hal = { workspace = true, optional = true }
nb = { workspace = true, optional = true }
heapless = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
esp-rtos = { workspace = true, optional = true, features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { workspace = true, optional = true, features = ["esp32s3", "ble", "unstable"] }
esp-alloc = { workspace = true, optional = true, features = ["esp32s3", "compat", "global-allocator"] }
trouble-host = { workspace = true, optional = true, features = ["peripheral", "gatt", "derive", "default-packet-pool"] }
bt-hci = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
rk-rs = { workspace = true }

[dev-dependencies]
