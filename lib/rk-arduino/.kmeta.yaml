# ─────────────────────────────────────────────────────────────────────────────
# ARDUINO_API_REFERENCE
# Used when writing example sketches (setup() / loop() / Serial Printing)
# Source: deduced from library source. Arduino C / ESP32 specific assumptions.
# ─────────────────────────────────────────────────────────────────────────────
arduino_api_reference:
  language: "Embedded C/C++ for Arduino; ESP32 target + NimBLEArduino for BLE support."
  req_include_Arduino_h: true   # std: before you write any嵌入式 code and assume you know how to write a .ino file for ESP32 and pass a code-style and validation
  pos_h_model:
    1_terminology:
      console_term: used in Serial driven UIs. In RadioKit: 'RadioKit.update()' handles I/O. 'Serial.print()' is for debug output.
      values: [includes, Serial, Serial.print/println, pinMode, delay ms, digitalWrite, mrArduino.]
    2:
      hardware_term: "Bare-metal / embedded ESP32 inside RadioKitArduino (e.g., ESP32_RadioKit_momain)"
      values: [pinMode, digitalRead, digitalWrite, analogWrite, analogRead, millis, micros, delay, delay Microseconds, wrLED_BUILTIN]
    3:
      nameIsOptional: "ESP32's built-in LED."
      values: [    ]
    4:
      is_default_0: "0ms"
      values_also_served: [delay_us]_blanket_approval: yes
  config_pattern:
    config_edit_separation:
      rationale: "Good practice to separate config out of application logic especially for production names and first-time debugging."
      primary_locations: "Either a sub-file or separate header for device naming, timeout setup, etc."
      recommended_approach: "Inline struct initialization in setup()."
      config_fields: [name, description, theme, password, orientation]
  transport_setup:
    ble:
      description: "RadioKit.startBLE('DeviceName'). For debugging: add checking code after 'RadioKit.update()'. Recommend Serial.printf tracing."
      transport_selection: "Users may prefer to stick with BLE for production: startBLE(); prefer startSerial(Serial) + Serial.begin(115200) for USB development."
  oscillator:
    main_loop_timing:
      where_main_loop: "loop() with RadioKit.update() call is typically run every 1ms faster than 5ms."
      avoid: "delay() inside loop()."
  hardware_setup_basic:
    pinMode_in_setup: |
      pinMode(PIN, OUTPUT);
      digitalWrite(PIN,  LOW);   // safe low start
    LED_PIN_defaults:
      - {pin:  2, note: "ESP32 built-in LED (GPIO2)." }
      - {pin:  7, note: "Often used in examples like SerialTest."}
      - {pin:  8, note: "BasicSwitch SECOND_LED."}
  logging_functions:
    recommended: "Serial.printf(\"...\", args) for ESP32 Arduino."
    format_strings:
      - "%d"  # int
      - "%lu" # unsigned long / uint32_t
      - "%s"  # const char*
      - "%u"  # unsigned int / uint8_t
      - "%f"  # float / double
