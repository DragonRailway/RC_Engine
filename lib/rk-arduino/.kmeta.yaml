# RadioKit Arduino Library — Comprehensive Design Knowledge Base
# Generated by exhaustive review of all library source files.
# Library version: 2.0.0 — Protocol v3 — Architecture: ESP32 (also Nordic/SAMD/STM32)
# All items below are grounded in and verified from the actual source code.

# ─────────────────────────────────────────────────────────────────────────────
# GENERAL KNOWLEDGE
# Everything you need to know to write, extend, or modify this library.
# ─────────────────────────────────────────────────────────────────────────────
general_knowledge:
  library_overview: >
    RadioKit is an open-source RemoteXY-compatible library for Arduino.
    It sends UI configuration and variable data over a binary protocol
    (v3) via BLE (NimBLE) or USB Serial to a Flutter companion app.
    Widgets self-register on construction; RadioKit.update() manages
    all packet I/O and reliability in loop().
  project_structure: |
    arduino-library/
      src/
        RadioKit.h              # Main user-facing header (+ convenience includes)
        RadioKitConfig.h        # Constants, enums, macros
        RadioKitProtocol.h/.cpp # Packet builder + receive state machine + CRC16
        RadioKitWidgets.h       # Includes all widget headers
        RadioKit.cpp/.h         # Main class: registry, protocol dispatch, bus reliability
        widgets/
          Widget.h/.cpp         # Abstract base class for all widgets
          Button.h/.cpp         # RK_PushButton, RK_ToggleButton (RK_TYPE_PUSH=0x01, TOGGLE=0x02)
          SlideSwitch.h/.cpp    # RK_SlideSwitch, RK_RockerSwitch (RK_TYPE_SLIDE_SWITCH=0x08)
          Slider.h/.cpp         # RK_Slider, RK_GasPedal (RK_TYPE_SLIDER=0x03)
          Joystick.h/.cpp       # RK_Joystick (RK_TYPE_JOYSTICK=0x04)
          Knob.h/.cpp           # RK_Knob (RK_TYPE_KNOB=0x09)
          LED.h/.cpp            # RK_LED (RK_TYPE_LED=0x05)
          Text.h/.cpp           # RK_Text, RK_Serial (RK_TYPE_TEXT=0x06)
          Multiple.h/.cpp       # RK_MultipleButton, RK_MultipleSelect (RK_TYPE_MULTIPLE=0x07)
        connection/
          RadioKitTransport.h   # Abstract transport interface
          RadioKitBLE.h/.cpp    # NimBLE-Arduino transport
          RadioKitSerial.h/.cpp # USB-Serial transport
      examples/
        BLE_BasicSwitch/
        BLE_RC_Truck/
        SerialTest/
        JoystickMotor/
        SliderServo/

  sketch_pattern: |
    1. #include <RadioKit.h>     (pulls in all widget headers)
    2. Declare widget objects globally (Widget type propsStruct(params){...})  <- self-register
    3. In setup(): set RadioKit.config.* fields, then call RadioKit.begin()
    4. Start transport: RadioKit.startBLE("Name") or RadioKit.startSerial(Serial)
    5. In loop(): always call RadioKit.update() first, then read widgets, write outputs

  wheel_reinforcing_principles:
    widget_lifetime:
      detail: "Widget constructor auto-registers via _registerSelf() → _pushDeferred() → drained at RadioKit.begin()"
    registration_order:
      detail: "DrainDeferred() collects all global widgets in a linked-list, then passes them to RadioKit._registerWidget(). widgetId = 0,1,… in order. DO NOT reorder."
    update_must_be_called_every_loop:
      detail: "Dispatches inbound packets, runs shadow-vs-current diff (auto-pushUpdate), and retries reliability."
    shadow_state:
      detail: "_shadowInput[i][0..3] stores the last-known input bytes for each widget. If serializeInput() differs from shadow, pushUpdate(i) is enqueued. Only for input widgets (inputSize()>0)."
    var_update_reliability:
      detail: "VAR_UPDATE / SET_INPUT reliable. One in-flight pending at a time. 5 max retries @ 500 ms. Falls back to FULL_SYNC (_handleGetVars) on drop."
    meta_update_reliability:
      detail: "META_UPDATE reliable. Same ONE-in-flight mechanism as VAR_UPDATE."
    transport_agnostic:
      detail: "RadioKit holds a RadioKitTransport* pointer. startBLE() / startSerial() sets _transport. update() && isConnected() calls provided by both backends."
    default_values_in_structs:
      detail: "All Props structs use C++11 in-class default member initializers (e.g., uint8_t x=0). Named intializer {.x=10,.y=20,…} — do NOT use positional arguments for struct initialization."
    config_editable_separately_from_implementation:
      detail: "Library config (RadioKit.config.* and widget defaults) is held entirely in structs, not in C pre-processor macros. Users can edit config values, widget props, and transport selection without touching any hidden macro layers."

  str_basics:
    str_defined:
      values:
        - RK_STR_LABEL   1 << 0
        - RK_STR_ICON    1 << 1
        - RK_STR_ONTEXT  1 << 2
        - RK_STR_OFFTEXT 1 << 3
        - RK_STR_CONTENT 1 << 4
        - RK_STR_EXTRA   1 << 5
    mask_present_in_buffer:
      detail: "First byte of each widget's string payload is a bitmask. If bit set, the following field is: uint8 len + len bytes of data."

# ─────────────────────────────────────────────────────────────────────────────
# WIDGET CLASSES  (all in src/widgets/)
# ─────────────────────────────────────────────────────────────────────────────
widgets:
  base:
    widget_class: RadioKit_Widget                       # src/widgets/Widget.h
    file: "arduino-library/src/widgets/Widget.h"
    lifecycle: "Constructor calls _registerSelf(). begin() drains the deferred list. Widget ID assigned from 0."
    slots:
      - name: typeId
        type: uint8_t
        detail: "Widget type constant (0x01..0x09). Set by each widget constructor."
      - name: widgetId
        type: uint8_t
        detail: "Sequential ID 0..15. Assigned at registration."
    accessors:
      - uint8_t   x()
      - uint8_t   y()
      - uint8_t   height()
      - uint8_t   width()
      - int16_t   rotation()
      - bool      enabled()
      - uint8_t   style()
      - uint8_t   variant()
      - const char* label()
      - const char* icon()
      - const char* onText()
      - const char* offText()
    serialization_virtuals:
      - uint8_t  inputSize()  const  = 0
      - uint8_t  outputSize() const  = 0
      - void     serializeInput(uint8_t* buf)   const  = 0
      - void     serializeOutput(uint8_t* buf)  const  = 0
      - void     deserializeInput(const uint8_t* buf)    = 0
    description_str: >
      Base class. Do not instantiate directly.
      All widgets auto-register via _registerSelf() (deferred list → drained in begin()).
    string_helpers:
      buf_mask_first_byte:
        detail: "serializeStrings() writes a bitmask byte (str_mask) indicating which optional fields are present, then writes each non-empty field as [len_uint8][text...]"

  push_button:
    file: "src/widgets/Button.h, src/widgets/Button.cpp"
    type_id: RK_TYPE_PUSH_BUTTON  # 0x01
    props_struct: RK_ButtonProps
    struct_fields:
      x: uint8_t      default 0
      y: uint8_t      default 0
      height: uint8_t default 10
      width: uint8_t  default 0
      rotation: int16_t default 0
      icon: const char* default nullptr
      onText: const char* default nullptr
      offText: const char* default nullptr
      label: const char* default nullptr
      active: bool    default false
      state: bool     default false
    class: RK_PushButton
    with_props_struct: true
    signed_function_meaning: "typeId is set to RK_TYPE_PUSH_BUTTON. _pushDeferred registers self. get() returns props.state (true only while user holds button in app)."
    methods:
      - name: isPressed
        returns: bool
        detail: "Returns true while user is holding the button in the app. Identical to get() for PushButton."
      - name: clicked
        returns: bool
        detail: "Edge-detect: returns true once on press, then false until release + re-press. _pendingPress flag set in deserializeInput."
      - name: get
        returns: bool
        detail: "Returns props.state."
      - name: set
        params: [val: bool]
        detail: "Forces props.state = val; calls pushUpdate(widgetId). Use for programmatic state changes."

  toggle_button:
    file: "src/widgets/Button.h, src/widgets/Button.cpp"
    type_id: RK_TYPE_TOGGLE_BUTTON  # 0x02
    props_struct: RK_ButtonProps
    class: RK_ToggleButton
    with_props_struct: true
    signed_function_meaning: "typeId = RK_TYPE_TOGGLE_BUTTON. get() toggles between true/false on each tap in the app; state is latched until next tap."
    methods:
      - name: get
        returns: bool
      - name: set
        params: [val: bool]

  slide_switch:
    file: "src/widgets/SlideSwitch.h, src/widgets/SlideSwitch.cpp"
    type_id: RK_TYPE_SLIDE_SWITCH  # 0x08
    props_struct: RK_SlideSwitchProps
    struct_fields:
      x: uint8_t      default 0
      y: uint8_t      default 0
      height: uint8_t default 10
      width: uint8_t  default 0
      rotation: int16_t default 0
      icon: const char* default nullptr
      variant: uint8_t default 0   # 0=Slide Switch, 1=Rocker Switch
      onText: const char* default nullptr
      offText: const char* default nullptr
      label: const char* default nullptr
      active: bool    default false
      state: bool     default false
    class: RK_SlideSwitch
    with_props_struct: true
    signed_function_meaning: "Renders as iOS horizontal slide switch. variant 0=Slide Switch, 1=Rocker Switch. get() returns props.state."
    methods:
      - name: get
        returns: bool
      - name: set
        params: [val: bool]
      - name: setIcon
        params: [val: const char*]
    variant_classes:
      - RK_RockerSwitch: "subclass of RK_SlideSwitch. Sets props.variant = 1 on construction."

  slider:
    file: "src/widgets/Slider.h, src/widgets/Slider.cpp"
    type_id: RK_TYPE_SLIDER  # 0x03
    props_struct: RK_SliderProps
    struct_fields:
      x: uint8_t      default 0
      y: uint8_t      default 0
      height: uint8_t default 10
      width: uint8_t  default 0
      rotation: int16_t default 0
      icon: const char* default nullptr
      centering: uint8_t default RK_SPRING_NONE
      variant: uint8_t  default 0
      label: const char* default nullptr
      active: bool    default false
      value: int8_t   default 0   # -100 to +100
    class: RK_Slider
    with_props_struct: true
    signed_function_meaning: "Linear analog control (-100..+100). centering set spring mode (passed by props.centering, NOT by a separate enum pointer)."
    methods:
      - name: get
        returns: int8_t
      - name: set
        params: [val: int8_t]
        detail: "Clamped to -100..+100."
      - name: centering
        returns: uint8_t
      - name: detents
        returns: uint8_t
    variant_classes:
      RK_GasPedal: >
        Subclass of RK_Slider. Sets variant = 0x80 | RK_SPRING_CENTER (radio 0x80 is RK_SHAPE_ALT).
        Springs to center (idle) on release. centering = RK_SPRING_CENTER.
        User must also set props.value = -100 for initial idle indication.

  knob:
    file: "src/widgets/Knob.h, src/widgets/Knob.cpp"
    type_id: RK_TYPE_KNOB  # 0x09
    props_struct: RK_KnobProps
    struct_fields:
      x: uint8_t      default 0
      y: uint8_t      default 0
      height: uint8_t default 20
      width: uint8_t  default 0
      rotation: int16_t default 0
      icon: const char* default nullptr
      startAngle: int16_t default -135
      endAngle: int16_t   default 135
      centering: uint8_t default RK_SPRING_NONE
      variant: uint8_t  default 0   # 0=standard, 1=steeringWheel, bit 7]=RK_SHAPE_ALT
      centerIcon: const char* default nullptr
      label: const char* default nullptr
      active: bool    default false
      value: int8_t   default 0    # -100 to +100
    class: RK_Knob
    with_props_struct: true
    signed_function_meaning: "Rotary analog control (-100..+100). centering is always RK_SPRING_CENTER or RK_SPRING_NONE. variant RK_SHAPE_ALT(a.k.a 0x80) marks it as 0-12 o'clock ROLL BAR knob."
    methods:
      - name: get
        returns: int8_t
      - name: set
        params: [val: int8_t]
      - name: centering
      - name: detents
      - name: knobVariant
      - name: centerIconStr

  joystick:
    file: "src/widgets/Joystick.h, src/widgets/Joystick.cpp"
    type_id: RK_TYPE_JOYSTICK  # 0x04
    props_struct: RK_JoystickProps
    struct_fields:
      x: uint8_t      default 0
      y: uint8_t      default 0
      height: uint8_t default 10
      width: uint8_t  default 0
      rotation: int16_t default 0
      icon: const char* default nullptr
      enabled: bool   default true
      centering: uint8_t default RK_SPRING_CENTER
      label: const char* default nullptr
      active: bool    default false
      xvalue: int8_t  default 0   # -100 to +100
      yvalue: int8_t  default 0   # -100 to +100
    class: RK_Joystick
    with_props_struct: true
    signed_function_meaning: "2-axis analog (-100..+100 each). centering.spring mode for thumbsticks. getX/getY/modify props.xvalueprops.yvalue."
    methods:
      - name: getX
        returns: int8_t
        detail: "X-axis value (-100..+100)."
      - name: getY
        returns: int8_t
        detail: "Y-axis value (-100..+100)."
      - name: centering
        returns: uint8_t
        detail: "Returns props.centering."
      - name: setX  # inferred from serializeInput
        params: [val: int8_t]
        detail: "Set X component of props.xvalue."
      - name: setY  # inferred from serializeInput
        params: [val: int8_t]
        detail: "Set Y component of props.yvalue."

  led:
    file: "arduino-library/src/widgets/LED.h, arduino-library/src/widgets/LED.cpp"
    type_id: RK_TYPE_LED  # 0x05
    props_struct: RK_LedProps
    struct_fields:
      x: uint8_t       default 0
      y: uint8_t       default 0
      height: uint8_t  default 10
      width: uint8_t   default 0
      rotation: int16_t default 0
      label: const char* default nullptr
      color: uint32_t default RK_OFF   # 0xRRGGBB hex
      state: bool     default false
      shape: uint8_t  default RK_LED_SHAPE_CIRCLE
      ledState: uint8_t default RK_LED_STATE_ON
      timing: uint16_t default 500
    class: RK_LED
    with_props_struct: true
    signed_function_meaning: "LED state is one of OFF/ON/BLINK/BREATHE. setLedState() sets props.state from ledState. pushUpdate(widgetId) on any property change (notify the app)."
    shape_constants:
      - RK_LED_SHAPE_CIRCLE  0
      - RK_LED_SHAPE_SQUARE  1
      - RK_LED_SHAPE_DIAMOND 2
      - RK_LED_SHAPE_STAR    3
    state_constants:
      - RK_LED_STATE_OFF     0
      - RK_LED_STATE_ON      1
      - RK_LED_STATE_BLINK   2
      - RK_LED_STATE_BREATHE 3
    methods:
      - name: on
        detail: "Sets props.state=true, props.ledState=RK_LED_STATE_ON, pushUpdate()."
      - name: off
        detail: "Sets props.state=false, props.ledState=RK_LED_STATE_OFF, pushUpdate()."
      - name: set
        params: [val: bool]
        detail: "Sets state + ledState, pushUpdate."
      - name: setColor
        params: [rgba: uint32_t]
        detail: "Sets props.color (0xRRGGBB hex), pushUpdate."
      - name: setShape
        params: [shape: uint8_t]
      - name: setLedState
        params: [ls: uint8_t]
        detail: "Sets props.ledState; props.state = (ls != RK_LED_STATE_OFF)."
      - name: setTiming
        params: [ms: uint16_t]

  text:
    file: "src/widgets/Text.h, src/widgets/Text.cpp"
    type_id: RK_TYPE_TEXT  # 0x06
    props_struct: RK_TextProps  (aka RK_DisplayProps used by RK_Serial / docs)
    struct_fields:
      x: uint8_t       default 0
      y: uint8_t       default 0
      height: uint8_t  default 10
      width: uint8_t   default 0
      label: const char* default nullptr
      content: const char* default ""
    class: RK_Text
    with_props_struct: true
    signed_function_meaning: "Read-only text label sent to the app. outputSize() = RADIOKIT_TEXT_LEN (32 bytes). set() pushes update via pushUpdate() and fills internal _text[32]."
    methods:
      - name: set
        params: [text: const char* | const String&]
        detail: "Copies up to RADIOKIT_TEXT_LEN-1 bytes into _text[32], null-terminates. Sets props.content = _text. pushUpdate(widgetId)."
      - name: get
        returns: const char*
        detail: "Returns _text (null-terminated)."

  serial:
    file: "src/widgets/Serial.h  (Serial.cpp not present, RK_Serial extends RK_Text)"
    type_id: RK_TYPE_TEXT  # inherits
    props_struct: RK_TextProps  (called RK_DisplayProps in Serial.h / docs)
    class: RK_Serial
    with_props_struct: false   # inherits RK_Text (uses Print interface)
    signed_function_meaning: "RK_Serial is also a Print. write(byte) ↦ set(single-char). println/print support added over RK_Text."
    methods:
      - name: print
        params: [format: "..."]
        detail: "Inherited from Print. Appends to internal buffer via write() chain → set() → pushUpdate."
      - name: println
        params: [format: "..."]
      - name: clear
        detail: "Memset(_text, 0). Does not push update automatically."

  multiple:
    file: "src/widgets/Multiple.h, src/widgets/Multiple.cpp"
    type_id: RK_TYPE_MULTIPLE  # 0x07
    props_struct: RK_MultipleProps
    struct_fields:
      x: uint8_t      default 0
      y: uint8_t      default 0
      height: uint8_t default 10
      width: uint8_t  default 0
      rotation: int16_t default 0
      variant: uint8_t default 0   # 0=Segments, 1=Grid, 2=Wheel
      items:
        type: std::initializer_list<RK_Item>
        default: {}
      label: const char* default nullptr
      active: bool    default true
      value: uint8_t  default 0
    class: RadioKit_Multiple
    with_props_struct: true
    signed_function_meaning: "State is a bitmask: bit i = item i selected (MultipleSelect) or item-index (MultipleButton). max_items=8. _pool pre-allocated; items populate slots by constructor. Items can pin themselves at bit 0 to bit 7 optionally."
    item_struct: RK_Item
    item_fields:
      label: const char* default nullptr
      icon:  const char* default nullptr
      pos:   uint8_t   default 255
    max_items: 8   # RADIOKIT_MAX_ITEMS (RadioKitConfig.h)
    methods:
      - name: get
        returns: uint8_t
        detail: "Returns props.value (bitmask for MultipleSelect; index for MultipleButton)."
      - name: get
        overload: "get(uint8_t index)"
        returns: bool
        detail: "MultipleSelect only: returns true if props.value has bit i set."
      - name: clear
        detail: "Memset _pool to 0; props.value = 0."
      - name: add
        params: [item: RK_Item]
      - name: remove
        params: [index: uint8_t]
    variant_classes:
      RK_MultipleButton:  "variant = 0 (radio-group: explicit first-slot wins)."
      RK_MultipleSelect:  "variant = 1 (bitmask-group)."

# ─────────────────────────────────────────────────────────────────────────────
# RADIOKIT MAIN CLASS  (src/RadioKit.h, src/RadioKit.cpp)
# ─────────────────────────────────────────────────────────────────────────────
radioretail:
  class: RadioKitClass
  singleton_extern: "RadioKitClass RadioKit;"
  with_props_struct: false
  config_struct: RK_Config
  signed_function_meaning: |
    Top-level singleton. Calls begin() (drains deferred widgets),
    startBLE() or startSerial() (sets _transport pointer),
    update() (runs transport.poll() + shadow-diff reliability). _transport
    and _widgets[] live here. Widget IDs assigned in registration order.
  config:
    user_settable:
      name:        const char*   default "RadioKit Device"
      password:    const char*   default ""
      description: const char*   default ""
      version:     const char*   default "1.0.0"
      type:        const char*   default ""
      theme:       const char*   default RK_DEFAULT  # "default"
      orientation: uint8_t       default RK_LANDSCAPE
      width:       uint8_t       default 0   # auto
      height:      uint8_t       default 0   # auto
    read_only:
      architecture: uint8_t  # RK_ARCH_DETECTED
      libversion:   const char*  # RK_LIB_VERSION
  lib_methods:
    - name: begin
      detail: "Drains deferred widget list via RadioKit_Widget_drainDeferred(). No-op if list empty. Must be called before startBLE/startSerial."
    - name: startBLE
      params: [deviceName: const char* = nullptr]
      detail: "Assigns _transport = &RadioKitBLEInstance. Calls _transport->begin(name, _onPacket). deviceName overrides config.name if provided."
    - name: startSerial
      params: [stream: Stream&]
      detail: "Assigns _transport = &RadioKitSerialInstance. Calls begin(stream, _onPacket). stream must already be initialized (e.g. Serial.begin(115200))."
    - name: update
      detail: >
        Called every loop().
        1. _transport->update()  (BLE: no-op unless reconnect needed; Serial: reads stream)
        2. For each input widget: serializeInput() → shadow diff → pushUpdate()
        3. Retry reliability: VAR_UPDATE (single in-flight, 5 retries @ 500ms, fallback full_sync_GET_VARS)
        4. META_UPDATE retry (same reliability pattern).
    - name: pushUpdate
      params: [widgetId: uint8_t]
      detail: "Sets bit in _pendingUpdatesMask. _varUpdateId/_varUpdateSeq track which widget is in-flight. Only one outstanding at a time."
    - name: pushMetaUpdate
      params: [widgetId: uint8_t]
    - name: isConnected
      returns: bool
    - name: getRssi
      returns: int8_t
  private:
    _widgets: "RadioKit_Widget*[RADIOKIT_MAX_WIDGETS=16]"
    _transport: "RadioKitTransport*  (null until startBLE/startSerial)"
    _shadowInput: "uint8_t[RADIOKIT_MAX_WIDGETS][4]  — last-known input for auto-push"
    _pendingUpdatesMask: "uint32_t bitmask of widgets pending VAR_UPDATE"
    _varUpdateId/Seq/Retries/SentAt: "Reliability bookkeeping for one-in-flight update"
    _pendingMetaMask/_metaUpdateId/Seq/Retries/SentAt: "Same for META_UPDATE"
    _txBuf: "uint8_t[RK_MAX_PACKET_SIZE=768]  — shared transmit buffer"

# ─────────────────────────────────────────────────────────────────────────────
# TRANSPORT  (src/connection/)
# ─────────────────────────────────────────────────────────────────────────────
transport:
  base_class: RadioKitTransport   # src/connection/RadioKitTransport.h
  interface_pure_virtuals:
    - void begin(const char* name, RK_PacketCallback cb) = 0
    - void update() = 0
    - void sendPacket(const uint8_t* buf, uint16_t len) = 0
    - bool isConnected() const = 0
    - int8_t getRssi() = 0
  callback_type: |
    typedef void (*RK_PacketCallback)(uint8_t cmd,
                                      const uint8_t* payload,
                                      uint16_t payloadLen);
  ble:   RadioKitBLE       # src/connection/RadioKitBLE.h
  serial: RadioKitSerialTransport  # src/connection/RadioKitSerial.h
  ble_note: >
    Uses NimBLE-Arduino. Service UUID: 0000FFE0-0000-1000-8000-00805F9B34FB
    Char UUID:        0000FFE1-0000-1000-8000-00805F9B34FB
    MTU: 20 bytes (negotiable). Chunking done in sendPacket().
    onConnect/onDisconnect toggle _connected. _onWrite feeds bytes to rk_rxFeedByte().
  serial_note: >
    Uses read() from the Stream. _lastPacketMs updated on valid packet.
    isConnected() = everReceived && (millis()-_lastPacketMs < TIMEOUT_MS=3000).
    Junk recovery resets framing after 1000ms silence.

# ─────────────────────────────────────────────────────────────────────────────
# PROTOCOL  (src/RadioKitProtocol.h, src/RadioKitProtocol.cpp)
# ─────────────────────────────────────────────────────────────────────────────
protocol:
  packet_format: "[0x55][LEN_LO][LEN_HI][CMD][PAYLOAD...][CRC_LO][CRC_HI]"
  where: "LEN = total packet bytes. CRC-16/CCITT-FALSE over CMD+PAYLOAD."
  constants:
    RK_START_BYTE:        0x55
    RK_HEADER_SIZE:       4
    RK_CRC_SIZE:          2
    RK_MIN_PACKET:        6
    RK_PROTOCOL_VERSION:  0x03
    RK_MAX_PACKET_SIZE:   768
    RK_RX_BUFFER_SIZE:    768
    RK_VAR_UPDATE_TIMEOUT_MS: 500
    RK_VAR_UPDATE_MAX_RETRIES: 5
  commands:
    - RK_CMD_GET_CONF       0x01
    - RK_CMD_CONF_DATA      0x02
    - RK_CMD_PING           0x03
    - RK_CMD_PONG           0x04
    - RK_CMD_ACK            0x05
    - RK_CMD_GET_VARS       0x06
    - RK_CMD_VAR_DATA       0x07
    - RK_CMD_VAR_UPDATE     0x08
    - RK_CMD_GET_META       0x09
    - RK_CMD_META_DATA      0x0A
    - RK_CMD_META_UPDATE    0x0B
    - RK_CMD_SET_INPUT      0x0C
    - RK_CMD_GET_TELEMETRY  0x0D
    - RK_CMD_TELEMETRY_DATA 0x0E
  utilities:
    rk_crc16: "CRC-16/CCITT-FALSE poly=0x1021 init=0xFFFF. Used over cmd+payload."
    rk_buildPacket: "Frames [START][LEN_LO][LEN_HI][CMD][payload][CRC_LO][CRC_HI]. Returns totalLen."
    rk_buildPong: "Builds RK_CMD_PONG packet."
    rk_buildAck: "Builds RK_CMD_ACK with seq byte."
    rx_feed_byte: rk_rxFeedByte() — state machine; returns true on complete valid packet.
    rx_enum: "RX_WAIT_START → RX_LENGTH_LO → RX_LENGTH_HI → RX_CMD → RX_PAYLOAD → RX_CRC_LO → RX_CRC_HI"
  conf_data_payload_structure: |
    [ver uint8][orient uint8][widgetCount uint8]
    [nameLen uint8][name bytes][descLen uint8][desc bytes]
    [pwdLen uint8][pwd bytes][themeLen uint8][theme bytes]
    For each widget:
      [typeId uint8][widgetId uint8][x uint8][y uint8][height uint8]
      [width uint8][rot_lo uint8][rot_hi uint8][style uint8][variant uint8]
      [strMask uint8][label optional][icon optional][onText optional][offText optional][content optional]
  var_data_payload_structure: |
    [value_i byte_count bytes] for each widget with outputSize() or inputSize() > 0
  cmd_dispatch:
    handleGetConf: "Sends _buildConfPayload → _sendPacket"
    handleGetVars: "Sends _buildVarPayload → _sendPacket"
    handleGetMeta: "Sends _buildMetaPayload → _sendPacket"
    handleSetInput: "Sequential: deserializeInput on each input widget, then ACK"
    handlePing: "Sends PONG"
    handleAck: "Clears pendingUpdatesMask/metaMask bit for _varUpdateId."
    handleTelemetry: "Sends RSSI in RFC 1921 RFC header"
    handleVarUpdate: "deserializeInput → shadow update → ACK"
    handleMetaUpdate: "no-op on metadata content → ACK (v2.1 todo)"

