[platformio]
default_envs = TRACKLINK_V3
src_dir = src

; Common configuration for all ESP32 boards
[env]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino
monitor_speed = 2000000
extra_scripts =
    pre:scripts/gen_boards_header.py
    pre:scripts/check_uploadfs_guard.py
lib_deps =
    ; ESP32_EasyKit standalone library (sibling repo)
    symlink://../ESP32_EasyKit
    ; RadioKit library
    symlink://../RadioKit/rk-arduino
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson @ ^7.0.4
lib_ldf_mode = deep+
test_ignore = .pio/*

board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I /home/sun/sandbox/fedora/.platformio/packages/framework-arduinoespressif32/libraries/FS/src
    -I /home/sun/sandbox/fedora/.platformio/packages/framework-arduinoespressif32/libraries/LittleFS/src

;------------------------------------------------------------------------------------------------------------------------
; TrackLink V3 Unified Vehicle Controller
[env:TRACKLINK_V3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_ota_4MB.csv
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	-D RK_ENABLE_FS
	-D TRACKLINK_V3
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-I common
	-I boards
	-I src
	; libdeps include paths (LDF chain is unreliable for headers in common/)
	-I .pio/libdeps/TRACKLINK_V3/ArduinoJson/src
	-I .pio/libdeps/TRACKLINK_V3/NimBLE-Arduino/src
	-I lib/SoundEngine/src
	-I ../ESP32_EasyKit/src
	; Boot button
	-D BOOT=0
	; Voltsense
	-D VSCALE=1.8
	-D VOFFSET=-0.2    ; PWM settings
	-D LED_FREQ=8000
	-D LED_RES=10
	-D DRV_FREQ=24000
	-D DRV_RES=8

;------------------------------------------------------------------------------------------------------------------------
; Mikro V2 Unified Vehicle Controller
[env:MIKRO_V2]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_ota_4MB.csv
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_qspi
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	-D RK_ENABLE_FS
	-D MIKRO_V2
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-I common
	-I boards
	-I src
	; libdeps include paths (LDF chain is unreliable for headers in common/)
	-I .pio/libdeps/MIKRO_V2/ArduinoJson/src
	-I .pio/libdeps/MIKRO_V2/NimBLE-Arduino/src
	-I lib/SoundEngine/src
	-I ../ESP32_EasyKit/src
	; Boot button
	-D BOOT=0
	; Voltsense
	-D VSCALE=1.8
	-D VOFFSET=-0.2
	; PWM settings
	-D LED_FREQ=8000
	-D LED_RES=10
	-D DRV_FREQ=24000
	-D DRV_RES=8
